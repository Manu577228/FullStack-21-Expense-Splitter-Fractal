<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D9488" />
    <meta
      name="description"
      content="Expense Splitter: create groups, split shared expenses equally or with custom amounts, and see who owes whom."
    />
    <meta name="author" content="Manu Bharadwaj" />

    <!-- Link previews (WhatsApp, LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Expense Splitter" />
    <meta property="og:title" content="Expense Splitter" />
    <meta
      property="og:description"
      content="Split shared expenses equally or with custom amounts and see who owes whom."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Expense Splitter" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts: Space Grotesk (quirky, techy headings) + Inter (clean body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Fonts applied to every MUI component, no JS changes needed */
      #root,
      #root * {
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #root .MuiTypography-h1,
      #root .MuiTypography-h2,
      #root .MuiTypography-h3,
      #root .MuiTypography-h4,
      #root .MuiTypography-h5,
      #root .MuiTypography-h6,
      #root .MuiTypography-subtitle1,
      #root .MuiButton-root {
        font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
        letter-spacing: -0.01em;
      }
      html,
      body {
        margin: 0;
        background-color: #f8fafc;
        -webkit-font-smoothing: antialiased;
      }

      /* Loading screen: shown until React mounts, then replaced automatically */
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(600px 300px at 15% 10%, rgba(20, 184, 166, 0.14), transparent),
          radial-gradient(600px 300px at 85% 90%, rgba(37, 99, 235, 0.14), transparent),
          #f8fafc;
      }
      .boot-logo {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: linear-gradient(135deg, #14b8a6, #2563eb);
        display: grid;
        place-items: center;
        box-shadow: 0 18px 40px -14px rgba(37, 99, 235, 0.6);
        animation: boot-float 1.6s ease-in-out infinite;
      }
      .boot-name {
        font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
        font-weight: 700;
        font-size: 1.4rem;
        color: #0f172a;
        letter-spacing: -0.02em;
      }
      .boot-bar {
        width: 120px;
        height: 4px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #14b8a6, #2563eb, #f43f5e);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-6deg); }
      }
      @keyframes boot-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(300%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo, .boot-bar::after { animation: none; }
      }
    </style>

    <title>Expense Splitter</title>
  </head>
  <body>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 24px; text-align: center; color: #0f172a;">
        Expense Splitter needs JavaScript to run. Please enable it and reload.
      </div>
    </noscript>

    <div id="root">
      <div class="boot" role="status" aria-label="Loading Expense Splitter">
        <div class="boot-logo">
          <svg width="40" height="40" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M32 49V37M32 37L19 22M32 37L45 22M19 31V22H28M45 31V22H36" />
          </svg>
        </div>
        <div class="boot-name">Expense Splitter</div>
        <div class="boot-bar"></div>
      </div>
    </div>
  </body>
</html>
